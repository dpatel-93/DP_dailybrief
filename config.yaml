# DailyUpdates Configuration
# Comprehensive feeds for Azure infra, AI/Copilot, Security, and Markets

settings:
  articles_per_category: 5
  timezone: "US/Eastern"
  schedule_hour: 8  # 8am EST
  llm_model: "llama-3.3-70b-versatile"
  tts_voice: "en-GB-RyanNeural"
  max_age_hours: 48
  weekly_max_age_hours: 168  # 7 days for /weekly

  # Priority keywords — articles matching these get flagged with a star
  priority_keywords:
    - "App Gateway"
    - "Application Gateway"
    - "NSG"
    - "Network Security Group"
    - "Front Door"
    - "WAF"
    - "Web Application Firewall"
    - "Entra"
    - "Conditional Access"
    - "VNet"
    - "ExpressRoute"
    - "Private Link"
    - "Private Endpoint"
    - "Key Vault"
    - "Defender"
    - "Sentinel"
    - "breaking change"
    - "deprecat"
    - "end of life"
    - "retire"
    - "CVE-"
    - "zero-day"
    - "critical vulnerability"

  # Sports settings (football-data.org)
  sports:
    competitions:
      - "WC"   # FIFA World Cup
      - "CL"   # Champions League
      - "PL"   # Premier League
      - "PD"   # La Liga
      - "BL1"  # Bundesliga
      - "SA"   # Serie A
      - "FL1"  # Ligue 1
      - "MLS"  # Major League Soccer
    favorite_teams:
      - "Inter Miami"
    match_window_days: 2  # look ahead/behind for matches
    standings_competitions:
      - "WC"
      - "PL"
      - "MLS"

  # Category groups for filtered briefs (/brief azure, /brief markets, etc.)
  category_groups:
    azure:
      - azure_networking
      - azure_security
      - azure_apps
      - azure_containers
      - azure_data
      - azure_updates
      - azure_community
    ai:
      - ai_copilot
      - ai_industry
    security:
      - secops
    markets:
      - markets_news
      - markets_commodities
      - markets_crypto
    news:
      - news_national
      - news_world
    health:
      - health_alerts
      - health_recalls

