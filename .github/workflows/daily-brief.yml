name: Daily Brief

on:
  schedule:
    # 8am EST = 13:00 UTC (or 12:00 UTC during EDT)
    # Using 12:00 UTC for EDT (current daylight saving)
    - cron: "0 12 * * *"

  # Ad-hoc trigger — run manually from GitHub Actions tab
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual trigger"
        required: false
        default: "Ad-hoc brief requested"

jobs:
  daily-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Daily Brief
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.VAULT_PAT }}
        run: python -m src.main

      # Commits output/latest-brief.json back to this repo so Alfred's HUD can
      # read the finished brief text via the GitHub API — Telegram was the only
      # place it existed before this. Uses the job's own GITHUB_TOKEN (contents:
      # write above), not VAULT_PAT, since it only ever writes to this repo.
      - name: Commit brief output
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/latest-brief.json
          git diff --cached --quiet || git commit -m "Update latest brief output [skip ci]"
          git push
